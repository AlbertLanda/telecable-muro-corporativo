<div class="field {% if field.field.widget.input_type == 'checkbox' %}check-field{% endif %}" data-field="{{ field.name }}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required and field.field.widget.input_type != 'checkbox' %}<span class="required" aria-hidden="true"> *</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<small id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}
  {{ field.errors }}
</div>
